        widget: select
        default: Complete
        options:
          - { label: "Nominal — đang chạy", value: Nominal }
          - { label: "Complete — đã xong", value: Complete }
          - { label: "Research — nghiên cứu", value: Research }
        i18n: duplicate
      - { name: tags, label: Hệ thống / công nghệ, widget: list, required: false, i18n: duplicate }
      - { name: cover, label: Ảnh bìa, widget: image, required: false, i18n: duplicate }
      - { name: coverAlt, label: Mô tả ảnh bìa, widget: string, required: false, i18n: true }
      - name: links
        label: Liên kết
        widget: list
        required: false
        fields:
          - { name: label, label: Tên, widget: string, i18n: true }
          - { name: url, label: URL, widget: string, i18n: duplicate }
        i18n: true
      - { name: featured, label: Hiện ở trang chủ, widget: boolean, default: false, i18n: duplicate }
      - { name: draft, label: Bản nháp (chưa đăng), widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Nội dung, widget: markdown, i18n: true }
    i18n: true

  # ---------------------------------------------------------------
  - name: pages
    label: Trang
    files:
      - name: about
        label: Về tôi
        file: src/content/pages/about.{{locale}}.md
