# ==================================================================
#  SVELTIA CMS — trang quản trị nội dung tại https://longpeoo.io.vn/admin
#  Đăng nhập: "Sign In with GitHub" (qua worker sveltia-cms-auth ở auth.longpeoo.io.vn)
#  hoặc "Sign In Using Access Token" (GitHub fine-grained token, xem README.md).
#  Mỗi lần bấm Lưu = một commit lên GitHub → Cloudflare tự build & deploy (~1 phút).
# ==================================================================

backend:
  name: github
  repo: longPeoo/portfolio
  branch: main
  base_url: https://auth.longpeoo.io.vn
  # Repo public → chỉ xin quyền public_repo (không đụng tới repo private). Đổi repo sang private thì xoá dòng này.
  auth_scope: public_repo
  commit_messages:
    create: "Thêm {{collection}}: {{slug}}"
    update: "Cập nhật {{collection}}: {{slug}}"
    delete: "Xoá {{collection}}: {{slug}}"
    uploadMedia: "Tải lên {{path}}"
    deleteMedia: "Xoá {{path}}"

site_url: https://longpeoo.io.vn
display_url: https://longpeoo.io.vn

# Ảnh dùng chung (ít dùng) — ảnh của từng dự án/chuyến đi nằm cùng thư mục bài viết
media_folder: public/uploads
public_folder: /uploads

# Ảnh tải lên qua CMS được nén ngay trên trình duyệt, trước khi commit lên GitHub:
# đổi sang WebP, cạnh dài tối đa 2560px (ảnh bìa lớn nhất trên web là 2400px), chất lượng 85.
# Ảnh điện thoại 5–10 MB → còn khoảng 0,4–1 MB. Ảnh được vẽ lại nên mất luôn EXIF (gồm toạ độ GPS nơi chụp).
# Lúc build, Astro còn cắt tiếp ra nhiều cỡ nhỏ hơn cho người xem.
# Chặn file quá 20 MB (thường là ảnh RAW .dng: trình duyệt không hiển thị được, Cloudflare không phát file > 25 MiB).
media_libraries:
  default:
    config:
      max_file_size: 20000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2560
          height: 2560

# Tạo đường dẫn không dấu từ tiêu đề tiếng Việt: "Hà Giang" → "ha-giang"
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Song ngữ: tiếng Việt là mặc định (file gốc, ví dụ index.md); tiếng Anh nằm cạnh (index.en.md).
# Bài mới chỉ bật tiếng Việt; bật thêm EN trong trình soạn khi cần.
# Trường "duplicate" (ngày, toạ độ, ảnh…) chỉ nhập ở tiếng Việt, tự chép sang bản tiếng Anh.
i18n:
  structure: multiple_files
  locales:
    - vi
    - en
  default_locale: vi
  initial_locales: default
  omit_default_locale_from_file_path: true

collections:
  # ---------------------------------------------------------------
  - name: journeys
    label: Hành trình
    label_singular: Chuyến đi
    description: Mỗi chuyến đi là một thư mục gồm index.md và ảnh.
    folder: src/content/journeys
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    sortable_fields: [ date, title ]
    summary: "{{title}} — {{place}} ({{date}})"
    fields:
      - { name: title, label: Tiêu đề, widget: string, required: false, hint: "Để trống = dùng tên địa điểm", i18n: true }
      - { name: summary, label: Tóm tắt (1–2 câu), widget: text, required: false, i18n: true }
      - { name: date, label: Ngày bắt đầu, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, required: false, hint: "Để trống = xếp cuối danh sách", i18n: duplicate }
      - { name: endDate, label: Ngày kết thúc, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, required: false, i18n: duplicate }
      - { name: place, label: Địa điểm, widget: string, hint: "Ví dụ: Hà Giang", i18n: true }
      - { name: countryCode, label: Mã quốc gia (2 chữ), widget: string, default: VN, pattern: ['^[A-Za-z]{2}$', 'Nhập đúng 2 chữ cái, ví dụ VN, FR, JP'], hint: "Dùng để hiện cờ và tên nước. Ví dụ: VN Việt Nam, FR Pháp, JP Nhật Bản, CH Thụy Sĩ, IT Ý, IN Ấn Độ, US Mỹ, GB Anh", i18n: duplicate }
      - { name: country, label: Tên quốc gia (tuỳ chọn), widget: string, required: false, hint: "Để trống = tự lấy theo mã (FR → Pháp). Chỉ điền khi muốn gọi khác, ví dụ Ý thay cho Italy", i18n: true }
      - { name: lat, label: Vĩ độ, widget: number, value_type: float, hint: "Google Maps → chuột phải vào điểm → số đầu tiên", i18n: duplicate }
      - { name: lng, label: Kinh độ, widget: number, value_type: float, hint: "Số thứ hai", i18n: duplicate }
      - { name: cover, label: Ảnh bìa, widget: image, required: false, hint: "Chưa có ảnh bìa = chỉ hiện ghim và cờ trên địa cầu. Có ảnh bìa = có thêm thẻ và trang riêng", i18n: duplicate }
      - { name: coverAlt, label: Mô tả ảnh bìa, widget: string, required: false, hint: "Mô tả ngắn cho người khiếm thị và Google", i18n: true }
      - name: gallery
        label: Album ảnh
        widget: list
        required: false
        fields:
          - { name: src, label: Ảnh, widget: image, i18n: duplicate }
          - { name: caption, label: Chú thích (hiện dưới ảnh), widget: string, required: false, hint: "Để trống = dùng phần mô tả ảnh bên dưới", i18n: true }
          - { name: alt, label: Mô tả ảnh (cho người khiếm thị và Google), widget: string, hint: "Tả những gì có trong ảnh. Không hiện trên trang, trừ khi bỏ trống chú thích", i18n: true }
        i18n: true
      - { name: youtube, label: Link video YouTube, widget: string, required: false, i18n: duplicate }
      - { name: tags, label: Thẻ, widget: list, required: false, i18n: true }
      - { name: draft, label: Bản nháp (chưa đăng), widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Nội dung, widget: markdown, i18n: true }
    i18n: true

  # ---------------------------------------------------------------
  - name: projects
    label: Kỹ thuật
    label_singular: Dự án
    folder: src/content/projects
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    sortable_fields: [ date, title ]
    summary: "{{title}} ({{date}})"
    fields:
      - { name: title, label: Tên dự án, widget: string, i18n: true }
      - { name: summary, label: Tóm tắt (1–2 câu), widget: text, i18n: true }
      - { name: date, label: Thời gian, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, i18n: duplicate }
      - { name: role, label: Vai trò của tôi, widget: string, i18n: true }
      - name: status
