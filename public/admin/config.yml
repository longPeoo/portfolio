            fields:
              - { name: city, label: Thành phố, widget: string, i18n: true }
              - { name: code, label: Mã sân bay (3 chữ), widget: string, i18n: duplicate }
              - { name: timezone, label: Múi giờ, widget: string, i18n: duplicate }
              - { name: lat, label: Vĩ độ hiển thị, widget: string, i18n: duplicate }
              - { name: lon, label: Kinh độ hiển thị, widget: string, i18n: duplicate }
            i18n: true
          - { name: email, label: Email, widget: string, i18n: duplicate }
          - { name: homeCountry, label: Mã nước nhà (cờ "From" ở dải cờ), widget: string, default: VN, pattern: ['^[A-Za-z]{2}$', 'Nhập đúng 2 chữ cái, ví dụ VN'], i18n: duplicate }
          - { name: cv, label: File CV (nút tải ở trang Vũ trụ), widget: file, required: false, i18n: duplicate }
          - name: nav
            label: Menu
            widget: list
