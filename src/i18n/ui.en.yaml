videos:
  code: Key 04 · Vlogs
  title: '"All I carry is a backpack and a heart eager to learn"'
  intro: This is where I keep the vlogs from my wanderings all over the place. There's no particular reason behind it. Lots of views would be nice, but that's not what I'm after. I just want something to sit down and watch with my family one day, so the generations after me can see how brilliantly their dad, their grandpa, their great-grandpa lived (at least in my eyes, hehe).
