  code: Key 03 · Journeys
  title: “A journey of a thousand miles begins with a single step”
  intro: To me, every journey is a lesson worth remembering, because we came into this world with one main mission, to experience everything life has to offer. From the not-so-good to the good, from the not-so-joyful to the joyful, from the not-yet-happy to the happy. Live in a way that leaves nothing to regret or grieve over when you look back.
