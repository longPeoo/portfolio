contact:
  code: Contact · Send Longpeoo a signal now
  title: Send a signal now
  titleEm: I'm always tuned in.
  intro: Whether it's an engineering project, a research and development collaboration, a brand looking to book me, or you simply want to chat and talk more about space science and technology, just drop me an email.
  metaTitle: Contact
  metaDescription: Get in touch about collaborations or sponsorships, or just to say hi to {name}.
inbox:
  code: Inbox · Ask me anything
  title: Or message me right here
  intro: Shy about giving your name? Just ask anonymously. I read every message, and if you leave an email, I'll reply there.
  modeLabel: Message type
  modeAnonymous: Ask anonymously
  modeNamed: Leave a message
  name: Your name
  email: Email
  phone: Phone number
  optional: optional
